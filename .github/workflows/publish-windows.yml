name: Publish Windows per-key RGB release
on:
  push:
    branches: [main]
    paths:
      - 'release-assets/windows-1.5.2.1/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-1.5.2.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locally tested artifacts
        working-directory: release-assets/windows-1.5.2.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish installer, guarded flasher, portable app and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.5.2.1
          cd release-assets/windows-1.5.2.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its files automatically.'
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title 'GMK104 per-key RGB — Windows installer and firmware flasher 1.5.2.1' \
            --notes-file RELEASE-NOTES.md \
            GMK104-Lighting-Studio-Windows-Setup-1.5.2.1.exe \
            GMK104-Firmware-Flasher-1.5.2.1.exe \
            GMK104-Windows-Portable-1.5.2.1.zip \
            GMK104-Windows-Source-1.5.2.1.zip SHA256SUMS.txt
          mkdir verified-downloads
          gh release download "$tag" --dir verified-downloads
          (cd verified-downloads && sha256sum --check SHA256SUMS.txt)
          gh release edit "$tag" --draft=false --prerelease --latest=false
