name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated offline suites
        shell: powershell
        run: ./windows/build.ps1 -Tests
      - name: Check the public firmware catalog
        run: python scripts/verify-release-catalog.py
      - name: Build complete Windows packages
        shell: powershell
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Hosted runner Inno Setup compiler is missing' }
          ./windows/package.ps1 -InnoCompiler $compiler -SkipTests -Version 1.0.2
          ./windows/Installer/Test-Package.ps1 -InnoCompiler $compiler -Version 1.0.2
      - name: Save complete Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-1.0.2
          if-no-files-found: error
          path: |
            outputs/release-1.0.2/*
            outputs/Windows-1.0.2-Preview.png
            outputs/Windows-Package-Verification.json
