name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated offline suites
        shell: powershell
        run: ./windows/build.ps1 -Tests
      - name: Check the public firmware catalog
        run: python scripts/verify-release-catalog.py
