name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test renderers, persistence, USB and firmware plans
        run: ./mac/test.sh
      - name: Verify public firmware catalog
        run: python3 scripts/verify-release-catalog.py
      - name: Build both apps
        run: |
          ./mac/build.sh
          ./mac/Firmware/build.sh
      - name: Verify signed bundles
        run: |
          codesign --verify --deep --strict 'outputs/GMK104 RGB Controller.app'
          codesign --verify --deep --strict 'outputs/GMK104 Firmware Installer.app'
      - name: Package both Mac apps together
        run: ./mac/package.sh
      - name: Save complete Mac release packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-1.0.2
          if-no-files-found: error
          path: |
            outputs/GMK104-Lighting-Studio-1.0.2-macOS-arm64.dmg
            outputs/GMK104-Lighting-Studio-1.0.2-macOS-arm64.zip
            outputs/GMK104-Firmware-Installer-1.0.2-macOS-arm64.zip
